[script://$SPLUNK_HOME/etc/apps/TA-service/bin/service_events.py]
interval = 60
index = main
sourcetype = service:status
source = status
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-service/bin/service_metrics.py]
interval = 60
index = metrics
